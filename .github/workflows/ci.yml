name: CI

# The competition rules require documentation sufficient to reproduce the results, so
# the checks that matter here are the ones a reviewer would run themselves: lint, tests,
# and a full pipeline pass on synthetic data.
#
# Manual trigger only, and not because the workflow is broken. Actions cannot start on
# this account at all: every run ends in three seconds having executed zero steps, with
# "the job was not started because your account is locked due to a billing issue". A wall
# of red crosses on a public repository reads as broken code, which is the opposite of
# what it means here.
#
# The same checks run locally instead, through `python scripts/verify.py`, in the same
# order, and `tests/unit/test_verify_matches_ci.py` compares the two step lists so they
# cannot drift apart. A fork with working Actions restores automatic runs by putting back
# the two lines below the dispatch trigger.
on:
  workflow_dispatch:
  # push:
  #   branches: ["**"]
  # pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        # The integration tests generate a synthetic dataset and run the whole pipeline
        # end to end, including a submission file, so no competition data is needed.
        run: pytest tests -q

      - name: Pipeline smoke run on synthetic data
        # Proves the documented commands actually work from a clean checkout, which is
        # what "sufficient documentation to reproduce" has to mean in practice.
        run: |
          python tests/make_fixture.py --out /tmp/fixture/00_raw --per-day 60
          python scripts/probe_data.py --data-dir /tmp/fixture
          python scripts/train_baseline.py --data-dir /tmp/fixture --rounds 40
          python scripts/make_submission.py --data-dir /tmp/fixture \
            --team keen-hamburger --rounds 40 --seeds 1
