[project]
name = "taxiout"
version = "0.1.0"
description = "Taxi-out time prediction for the PRC Data Challenge 2026"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "typer>=0.12",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "nbstripout>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
